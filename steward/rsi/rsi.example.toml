# steward-rsi configuration. Copy to rsi.toml (git-ignored) and edit.
# Relative paths are resolved against the directory that holds this file.

[advisor]
# The advisor reads the funnel, event digests and frames and suggests the next change.
# One of: "claude", "openai", "deepseek". Only the selected section below is used.
provider = "deepseek"
# Language of the advice.
language = "English"

# For every provider: put the key in api_key, or leave api_key empty and export the
# variable named in api_key_env. A non-empty api_key wins. Keys are never logged.
# Model names below are placeholders; replace them with a model your account can use.

[claude]
model = "claude-opus-5-5"
base_url = "https://api.anthropic.com"   # requests go to {base_url}/v1/messages
api_key_env = "ANTHROPIC_API_KEY"
api_key = ""
effort = "high"            # sent as output_config.effort; "" omits it
thinking = ""              # "" omits it; "adaptive" sends thinking: {type: adaptive}
send_images = true
max_images = 6
max_tokens = 16000
timeout_s = 300
max_retries = 3

[openai]
model = "REPLACE_WITH_OPENAI_MODEL"
base_url = "https://api.openai.com/v1"   # requests go to {base_url}/chat/completions
api_key_env = "OPENAI_API_KEY"
api_key = ""
effort = "high"            # sent as reasoning_effort; "" omits it
send_images = true
max_images = 6
max_tokens = 16000         # sent as max_completion_tokens; reasoning tokens count against it
timeout_s = 300
max_retries = 3

[deepseek]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"    # requests go to {base_url}/chat/completions
api_key_env = "DEEPSEEK_API_KEY"
api_key = ""
effort = "high"            # sent as reasoning_effort; "" omits it
send_images = true         # image parts use the OpenAI-compatible image_url format
max_images = 6
max_tokens = 32000         # sent as max_tokens; reasoning tokens count against it
timeout_s = 300
max_retries = 3

[machine]
backend = "gpu"            # "gpu" runs python -m steward.cli; "npu" runs python -m steward_npu
devices = [0, 1, 2, 3, 4, 5, 6, 7]   # physical card indices; list the cards you have
episodes_per_device = 1    # concurrent episodes per card
wall_minutes = 75          # wall-clock limit per episode, counted from the moment the task is sent
# Python of the Steward simulation environment (empty: <repo>/steward/.venv/bin/python).
python = ""
base_port = 31000          # slot k uses base_port+10k (World), +1 (robot), +2 (Ego API)
# Optional: one segmentation config per device, e.g. to give each card its own SAM service.
segmentation_configs = []
# Extra environment for every episode, e.g. LD_LIBRARY_PATH or CANN variables.
env = {}

[task]
name = "airplane"          # "airplane" or "car"
task_file = ""             # empty: the bundled steward_rsi/tasks/<name>.md
seeds = [0, 1, 2, 3, 4, 5, 6, 7]   # one episode per seed; use 32 or 64 seeds for a larger batch
threshold_mm = 20          # lateral hole error allowed for "complete"
strict_mm = 6              # always reported as well
start_state_dir = ""       # empty: start from scratch; else a directory of <seed>.json (see save-start)
kit_body = ""              # empty: chosen from the task name
phase = "phase1-sam"

[run]
sample_every_s = 30        # World State samples (truth_samples.jsonl) for milestones and interference checks
frame_every_min = 10       # rendered frames for the advisor; 0 keeps only start and final frames
startup_timeout_s = 900
build_timeout_s = 1800
isolate_harness = true     # copy the robot Harness home per episode (separate sessions and saved capabilities)
robot_harness_template = "" # empty: <repo>/steward/var/dsh/robot-1
pause_on_perception_fault = false

[paths]
repo_root = "../.."        # repository root (this file normally lives in <repo>/steward/rsi)
output_dir = "runs"
