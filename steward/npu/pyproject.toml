[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steward-npu"
version = "0.1.0"
readme = "README.md"
description = "Opt-in experimental Ascend rendering and SAM 3 backends for Steward"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "torch>=2.1", "mujoco>=3.3"]

[project.scripts]
steward-npu = "steward_npu.__main__:main"
steward-sam3 = "steward_npu.perception.sam3_api_srv:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
