[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steward-rsi"
version = "0.1.0"
readme = "README.md"
description = "Opt-in batch runner, scorer and advisor loop for Steward toy-assembly self-improvement rounds"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
steward-rsi = "steward_rsi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steward_rsi = ["data/*.json", "tasks/*.md"]

[tool.black]
line-length = 120
